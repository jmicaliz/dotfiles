name: Tag main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          base="v$(date -u +%Y.%m.%d)"
          n=$(git tag -l "$base*" | wc -l)
          tag="$base"; [ "$n" -gt 0 ] && tag="$base.$n"
          git tag "$tag" && git push origin "$tag"
