name: Tag main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          base="v$(date -u +%Y.%m.%d)"
          n=$(git tag -l "$base*" | wc -l)
          tag="$base"; [ "$n" -gt 0 ] && tag="$base.$n"
          git tag "$tag" && git push origin "$tag"
