# Env vars exported from ~/.secrets.zsh. Only references live here, never values.
# personal entries read Bitwarden: item = item name, field = custom field (omit for the login password).
# work entries read Keeper: item = record UID, field = custom field label (omit for the password).
# suffix (optional) is appended to the value.
